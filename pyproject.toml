[project]
name = "legado-ia"
version = "0.1.0"
description = "Aplicación web de preservación y simulación conversacional de legado personal con cifrado en reposo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pymysql==1.1.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "cryptography==44.0.0",
    "argon2-cffi==23.1.0",
    "aiosmtplib==3.0.2",
    "webauthn==2.5.1",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "faster-whisper==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "bandit==1.8.0",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]
