{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Iniciar sesión en legado-ia</h1>
  <form method="post" action="/auth/login">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <label>Usuario <input type="text" name="username" required maxlength="64"></label>
    <label>Contraseña <input type="password" name="password" required></label>
    <input type="hidden" name="altcha_payload" id="altcha_payload">
    <button type="submit">Continuar al segundo factor</button>
  </form>
</section>
<script src="/static/js/altcha.js" defer></script>
{% endblock %}
